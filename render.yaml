services:
  - type: web
    name: linkshield-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: linkshield-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: SCAN_LIMIT_ANONYMOUS_PER_HOUR
        value: "5"
      - key: SCAN_LIMIT_AUTHENTICATED_PER_HOUR
        value: "30"
      - key: SCAN_LIMIT_ADMIN_PER_HOUR
        value: "300"

  - type: keyvalue
    name: linkshield-redis
    region: singapore
    plan: free
    ipAllowList: []

databases:
  - name: linkshield-db
    databaseName: linkshield
    user: linkshield
    region: singapore
    plan: free
